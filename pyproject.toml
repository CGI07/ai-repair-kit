[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repair-kit"
dynamic = ["version"]
description = "A local-first desktop toolkit for AI development tools"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PySide6-Essentials==6.11.3"]

[project.optional-dependencies]
package = ["PyInstaller==6.22.3"]

[project.gui-scripts]
ai-repair-kit = "ai_repair_kit.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_repair_kit*"]

[tool.setuptools.package-data]
ai_repair_kit = ["translations/*.ts", "translations/*.qm"]

[tool.setuptools.dynamic]
version = {attr = "ai_repair_kit.__version__"}
