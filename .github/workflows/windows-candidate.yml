name: Windows candidate build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: --require-hashes -r scripts/windows-build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check tag version
        if: github.ref_type == 'tag'
        run: |
          $version = .\.venv\Scripts\python.exe -c "from ai_repair_kit import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag must match v$version"
          }
      - name: Test source
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Build candidate ZIP
        run: |
          .\scripts\build_windows.ps1
          .\.venv\Scripts\python.exe scripts/prepare_windows_notices.py build/windows-notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\package_windows.ps1 -OutputDirectory candidate -NoticesDirectory build/windows-notices
          $sqliteSource = 'sqlite-amalgamation-3540100.zip'
          Copy-Item -LiteralPath (Join-Path 'build\sqlite-runtime' $sqliteSource) -Destination candidate
          $sqliteHash = (Get-FileHash -LiteralPath (Join-Path candidate $sqliteSource)).Hash.ToLowerInvariant()
          Add-Content -LiteralPath candidate\SHA256SUMS.txt -Value "$sqliteHash  $sqliteSource" -Encoding ascii
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw "Unexpected source revision" }
          Set-Content -LiteralPath candidate\SOURCE-REVISION.txt -Value $revision -Encoding ascii
      - name: Test source with the bundled SQLite DLL
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import ctypes
          from pathlib import Path
          ctypes.WinDLL(str(Path("dist/AI-Repair-Kit/_internal/sqlite3.dll").resolve()))
          import sqlite3
          import unittest
          if sqlite3.sqlite_version != "3.54.1":
              raise RuntimeError("The test process did not load the bundled SQLite runtime.")
          unittest.main(module=None, argv=["unittest", "discover", "-s", "tests", "-v"])
          '@ | .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
